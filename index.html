<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2433" />
    <!-- 문병 링크 주소가 다른 사이트로 새어 나가지 않게 해요. 미리보기에는 정적인 제목만 보여요. -->
    <meta name="referrer" content="no-referrer" />
    <title>온기병동</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <header id="hud" hidden><span id="hud-main"></span><span id="hud-stats" hidden></span></header>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="remote-labels"></div>
    <div id="head-labels" hidden></div>
    <section id="settings" aria-label="설정" hidden></section>
    <p id="toast" role="status" hidden></p>
    <div id="left-cards" aria-live="polite"></div>
    <section id="inbox" hidden></section>
    <p id="connection-banner" role="status" aria-live="polite" hidden></p>
    <div id="sleep-root" hidden></div>
    <section id="action-bar" aria-label="내 동작" hidden></section>
    <section id="sleep-overlay" aria-label="수면 모드" hidden></section>
    <section id="entry" aria-label="병동에 들어가기" hidden></section>
    <main id="loading" role="status" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
