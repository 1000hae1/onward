<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2433" />
    <title>온기병동</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <header id="hud" hidden></header>
    <div id="remote-labels"></div>
    <div id="head-labels" hidden></div>

    <p id="toast" role="status" hidden></p>

    <section id="action-bar" aria-label="내 동작" hidden></section>
    <section id="entry" aria-label="병동에 들어가기" hidden></section>
    <main id="loading" role="status" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
