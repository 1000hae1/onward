<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 방명록 링크 주소가 다른 사이트로 새어 나가지 않게 해요. 미리보기에는 정적인 제목만 보여요(닉네임·병실 정보 없음). -->
    <meta name="referrer" content="no-referrer" />
    <title>온기병동</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E2433" />
    <!-- 로딩 화면은 자바스크립트와 style.css보다 먼저 보여야 해서 여기에 바로 넣어요. -->
    <style>
#loading { --cheese: #F2B45A; position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; justify-items: center; gap: .9rem; padding: 1.5rem; background: #1b2433; color: #e9e4d8; font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; font-size: clamp(1.125rem, 4vw, 1.5rem); font-weight: 400; letter-spacing: .08em; text-align: center; transition: opacity .4s ease; }
#loading[hidden] { display: none; }
#loading.is-leaving { opacity: 0; pointer-events: none; }
#loading p { margin: 0; }
.loading-track { width: min(12rem, 60vw); height: 3px; overflow: hidden; border-radius: 999px; background: rgba(233,228,216,.16); }
.loading-fill { width: 100%; height: 100%; background: var(--cheese); transform: scaleX(0); transform-origin: left center; transition: transform .45s ease-out; }
.loading-slow { font-size: .875rem; letter-spacing: .04em; color: rgba(233,228,216,.72); }
.loading-error { display: grid; gap: .8rem; justify-items: center; font-size: .9375rem; letter-spacing: .02em; line-height: 1.6; }
.loading-error[hidden] { display: none; }
.loading-retry { font: inherit; font-size: .9375rem; color: #1b2433; background: var(--cheese); border: 0; border-radius: 999px; padding: .5rem 1.2rem; cursor: pointer; }
#loading.is-error .loading-track, #loading.is-error .loading-title, #loading.is-error .loading-slow { display: none; }
@media (prefers-reduced-motion: reduce) {
  #loading, .loading-fill { transition: none; }
}

/* ---- 고양이 움직임: transform·opacity만 ---- */
/* 제자리에서 다다다 달려요. 앞다리 둘과 뒷다리 둘이 함께 뻗었다 모이고, 몸은 늘어났다 웅크리며 살짝 떠요.
   한 걸음 길이는 --stride(기본 0.45초). 로딩이 진행될수록 짧아져서 더 빨리 달려요. */
.cat-roam { --stride: 0.45s; }
.cat { display: block; overflow: visible; }
.cat g { transform-box: view-box; }
.cat .walk, .cat .sit { transition: opacity 0.35s ease; }
.cat .sit { opacity: 0; }
.cat .bob { transform-origin: 80px 72px; animation: run-body var(--stride) ease-in-out infinite; }
.cat .head { transform-origin: 112px 58px; animation: run-head var(--stride) ease-in-out infinite; }
.cat .tail { transform-origin: 40px 60px; animation: run-tail calc(var(--stride) * 2) ease-in-out infinite; }
.cat .fore { animation: run-fore var(--stride) ease-in-out infinite; }
.cat .hind { animation: run-hind var(--stride) ease-in-out infinite; }
.cat .leg-ff, .cat .leg-hf { animation-delay: calc(var(--stride) * -0.12); }
.cat .leg-hf { transform-origin: 48px 74px; }
.cat .leg-ff { transform-origin: 98px 74px; }
.cat .leg-hn { transform-origin: 58px 74px; }
.cat .leg-fn { transform-origin: 108px 74px; }
.cat .shadow { transform-box: fill-box; transform-origin: center; animation: run-shadow var(--stride) ease-in-out infinite; }
.cat .dust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: run-dust var(--stride) linear infinite; }
.cat .dust-2 { animation-delay: calc(var(--stride) * -0.5); }
.cat .eyes { transform-box: fill-box; transform-origin: center; animation: cat-blink 4s ease-in-out infinite; }
.cat .breath { transform-origin: 84px 94px; animation: cat-breath 3.2s ease-in-out infinite; }
.cat .tilt { transform-origin: 104px 46px; transform: rotate(-12deg); }

/* 0%: 앞다리는 앞으로, 뒷다리는 뒤로 쭉 뻗고 몸이 길어져요. 50%: 네 다리를 배 밑으로 모으고 몸이 동그랗게 떠요. */
@keyframes run-fore { 0%, 100% { transform: rotate(-38deg); } 50% { transform: rotate(28deg); } }
@keyframes run-hind { 0%, 100% { transform: rotate(36deg); } 50% { transform: rotate(-30deg); } }
@keyframes run-body { 0%, 100% { transform: translateY(0) scale(1.05, 0.96); } 50% { transform: translateY(-5px) scale(0.95, 1.04); } }
@keyframes run-head { 0%, 100% { transform: translateY(1px) rotate(-2deg); } 50% { transform: translateY(-2px) rotate(2deg); } }
@keyframes run-tail { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(10deg); } }
@keyframes run-shadow { 0%, 100% { transform: scaleX(1.05); opacity: 0.9; } 50% { transform: scaleX(0.85); opacity: 0.6; } }
@keyframes run-dust { 0% { transform: translate(0, 0) scale(0.6); opacity: 0; } 20% { opacity: 0.55; } 100% { transform: translate(-22px, -4px) scale(1.3); opacity: 0; } }
@keyframes cat-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
@keyframes cat-breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }

/* 연결 실패: 달리기를 멈추고, 따로 그린 앉은 자세로 부드럽게 바뀌어요. 고개를 갸웃하고 숨을 쉬어요. */
.is-sitting .walk { opacity: 0; }
.is-sitting .sit { opacity: 1; }

/* 움직임 줄이기: 가만히 서서 눈만 깜빡여요. */
.reduce .bob, .reduce .head, .reduce .tail, .reduce .fore, .reduce .hind, .reduce .shadow, .reduce .dust, .reduce .breath { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .cat .bob, .cat .head, .cat .tail, .cat .fore, .cat .hind, .cat .shadow, .cat .dust, .cat .breath { animation: none; }
}
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <header id="hud" hidden><span id="hud-main"></span><span id="hud-stats" hidden></span></header>

    <div id="head-labels" aria-hidden="true" hidden></div>
    <section id="settings" aria-label="설정" hidden></section>
    <p id="toast" role="status" hidden></p>
    <div id="left-cards" aria-live="polite"></div>
    <section id="inbox" hidden></section>
    <p id="connection-banner" role="status" aria-live="polite" hidden></p>
    <div id="sleep-root" hidden></div>
    <section id="moments" aria-live="polite" hidden></section>
    <section id="action-bar" aria-label="내 동작" hidden></section>
    <section id="sleep-overlay" aria-label="수면 모드" hidden></section>
    <section id="entry" aria-label="병동에 들어가기" hidden></section>
    <!-- 방명록(사과나무)이에요. 주인에게는 내 침대 메뉴에서, 링크로 온 분에게는 /guestbook에서 열려요. -->
    <section id="guestbook" hidden></section>
    <section id="gate" role="status" aria-live="polite" hidden></section>
    <main id="loading" role="status" aria-live="polite">
      <div id="loading-cat">
<div class="cat-roam">
<svg class="cat" viewBox="0 0 160 100" width="140" height="88" aria-hidden="true" focusable="false">

      <!-- 먼 쪽 다리: 조금 어둡게 -->
      <g class="leg hind leg-hf"><rect x="41.5" y="70" width="13" height="22" rx="6.5" fill="#E2A04C"/><ellipse cx="49" cy="92" rx="7" ry="3.6" fill="#EBD0A6"/></g>
      <g class="leg fore leg-ff"><rect x="91.5" y="70" width="13" height="22" rx="6.5" fill="#E2A04C"/><ellipse cx="99" cy="92" rx="7" ry="3.6" fill="#EBD0A6"/></g>
      <g class="bob">
        <g class="tail" fill="none" stroke-linecap="round" stroke-width="9">
          <path d="M40 60 C24 60 17 48 20 36 C22 28 30 26 32 32" stroke="#F2B45A"/>
          <path d="M40 60 C24 60 17 48 20 36 C22 28 30 26 32 32" stroke="#D98A2E" stroke-dasharray="3 7" stroke-dashoffset="-8" stroke-linecap="butt" stroke-width="7"/>

          <path d="M140 56l11-2M140 58l11 1" stroke="#FBE3BE" stroke-width="0.9" stroke-linecap="round" opacity=".85"/>
          <g class="eyes"><circle cx="128" cy="47" r="2.6" fill="#3D2E1F"/></g>

    </g>
    <!-- 앉은 모습: 엉덩이를 내리고 앞발은 곧게, 꼬리는 발 앞으로 감고 고개를 갸웃 -->

          <path d="M50 88 Q72 98 112 92" stroke="#F2B45A"/>

        </g>
        <g class="tilt">

          <path d="M110 19 L116 13 L117.5 21 Z" fill="#FBE3BE" stroke="#FBE3BE" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="104" cy="38" r="19" fill="#F2B45A"/>
          <path d="M97 22l1 5M102 20v5M107 21l-1 5" stroke="#D98A2E" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="115" cy="45" rx="8" ry="6" fill="#FBE3BE"/>

          <path d="M118.5 47q2 1.4 4-.2" fill="none" stroke="#3D2E1F" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M123 44l10-2M123 46l10 1" stroke="#FBE3BE" stroke-width="0.9" stroke-linecap="round" opacity=".85"/>
          <g class="eyes"><circle cx="111" cy="35" r="2.6" fill="#3D2E1F"/></g>
          <ellipse cx="107" cy="44" rx="3.4" ry="2.1" fill="#E8908A" opacity=".35"/>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>
      </div>
      <p class="loading-title">병동을 여는 중</p>
      <div class="loading-track" role="progressbar" aria-label="병동을 여는 중" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5"><div class="loading-fill" id="loading-fill" style="transform: scaleX(0.05)"></div></div>
      <p class="loading-slow" id="loading-slow" hidden>조금만 기다려 주세요</p>
      <div class="loading-error" id="loading-error" hidden>
        <p>병원 서버에 닿지 않아요. 잠시 후 다시 시도해 주세요</p>
        <button type="button" class="loading-retry" id="loading-retry">다시 시도</button>
      </div>
    </main>
    <section id="webgl-fallback" role="alert" hidden></section>
    <!-- 다른 분이 평안을 빌어 주거나 선물을 놓으면 화면 낭독기가 읽어요. 화면에는 보이지 않아요. -->
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
